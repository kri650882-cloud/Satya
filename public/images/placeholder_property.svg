<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg-prop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="60%" stop-color="#141210" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="gold-accent-gen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <pattern id="grid-gen" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#292524" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="0" cy="0" r="1.5" fill="#78716c" fill-opacity="0.3" />
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bg-prop)" />
  <rect width="800" height="500" fill="url(#grid-gen)" />

  <g transform="translate(400, 110)">
    <rect x="-110" y="-18" width="220" height="36" rx="18" fill="#1c1917" stroke="#d97706" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="-85" cy="0" r="4" fill="#f59e0b" />
    <text x="5" y="5" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle">SMRITI VIHAR</text>
  </g>

  <g transform="translate(400, 215)">
    <circle cx="0" cy="0" r="44" fill="#1c1917" stroke="#f59e0b" stroke-width="1.5" />
    <path d="M -18 -10 L 0 -22 L 18 -10 L 18 16 L -18 16 Z" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linejoin="round" />
    <path d="M -8 16 L -8 6 L 8 6 L 8 16" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linejoin="round" />
