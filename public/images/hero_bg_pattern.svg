<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="hero-glow" cx="70%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#b45309" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#78350f" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0c0a09" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="hero-glow-left" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#065f46" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0c0a09" stop-opacity="0" />
    </radialGradient>
    <pattern id="land-grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#292524" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="0" cy="0" r="1.5" fill="#f59e0b" fill-opacity="0.3" />
      <circle cx="80" cy="80" r="1" fill="#78716c" fill-opacity="0.2" />
    </pattern>
    <pattern id="plot-boundaries" width="320" height="240" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="320" height="240" fill="none" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.08" stroke-dasharray="8,8" />
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#0c0a09" />
  <rect width="100%" height="100%" fill="url(#hero-glow)" />
  <rect width="100%" height="100%" fill="url(#hero-glow-left)" />
  <rect width="100%" height="100%" fill="url(#land-grid)" />
  <rect width="100%" height="100%" fill="url(#plot-boundaries)" />

  <!-- Subtle Architectural Contour Topography Lines -->
  <g opacity="0.12" fill="none" stroke="#fbbf24" stroke-width="1.5">
    <path d="M 0,350 Q 400,280 800,420 T 1600,320 T 1920,400" />
    <path d="M 0,550 Q 500,420 1000,580 T 1700,500 T 1920,600" />
    <path d="M 0,750 Q 450,650 950,780 T 1650,720 T 1920,800" />
  </g>
</svg>
